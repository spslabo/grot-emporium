# Optional ESO examples: references only, NEVER credential values or stack URLs.
# Create the SecretStore and remote objects with your organization's tooling first.
# Each remote object is a JSON map of env-var names to values for that role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grot-backend-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: your-approved-store
    kind: SecretStore
  target:
    name: grot-backend-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: grot/backend
---

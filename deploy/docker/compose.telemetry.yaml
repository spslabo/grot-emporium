# Selected destination files live outside Git. Apps never receive cloud tokens.
x-telemetry: &telemetry
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  PYROSCOPE_ENABLED: "true"
  PYROSCOPE_SERVER_ADDRESS: http://alloy:4040
x-logging: &logging
  driver: syslog
  options: &log-options
    syslog-address: tcp://127.0.0.1:${GROT_SYSLOG_PORT:-15140}
    syslog-format: rfc5424micro
    mode: non-blocking
    max-buffer-size: 4m
services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    # Host-level access is necessary for container/cgroup accounting. No published port.
    privileged: true
    cgroup: host
    command:
      - --docker_only=true
      - --containerd=${GROT_CONTAINERD_SOCKET:-/rootfs/run/containerd/containerd.sock}
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.10.2
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
      - --collector.loadavg
      - --collector.uname
      - --collector.stat
      - --collector.time
      - --collector.os
    volumes:
      - /:/host:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9100/metrics]
      interval: 5s
      timeout: 3s
      retries: 30
  postgres:
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-postgres }
    depends_on:
      alloy: { condition: service_healthy }
  alloy:
    image: grafana/alloy:v1.20.0
    environment:
      GROT_DOCKER_PROJECT: ${GROT_DOCKER_PROJECT:?Use the grot launcher}
    command: ["run", "--disable-reporting", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    env_file:
      - path: ${GROT_ALLOY_ENV_FILE:?Select a private destination}
        format: raw
    volumes:
      - ../../observability/config-compose.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "127.0.0.1:${GROT_SYSLOG_PORT:-15140}:1514"
      - "127.0.0.1:${GROT_COLLECTOR_PORT:-12345}:12345"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/12345; printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3; head -n1 <&3 | grep -q '200'"]
      interval: 3s
      timeout: 3s
      retries: 30
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0700,size=1m
      - /var/cache/nginx:uid=101,gid=101,mode=0700,size=16m
      - /var/run:uid=101,gid=101,mode=0700,size=1m
    ports: ["127.0.0.1:${GROT_PORT:-8080}:8080"]
    env_file:
      - path: ${GROT_GATEWAY_ENV_FILE:?Select a private destination}
        format: raw
    environment:
      GROT_UI_UPSTREAM: ui:8080
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ../gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      ui: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30
  ui:
    ports: !reset []
    environment:
      <<: *telemetry
      JAVA_TOOL_OPTIONS: -javaagent:/app/pyroscope.jar
      PYROSCOPE_APPLICATION_NAME: grot-ui
      OTEL_METRICS_EXPORTER: otlp
      FARO_COLLECTOR_URL: /telemetry
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-ui }
    depends_on:
      alloy: { condition: service_healthy }
  cart:
    environment:
      <<: *telemetry
      JAVA_TOOL_OPTIONS: -javaagent:/app/pyroscope.jar
      PYROSCOPE_APPLICATION_NAME: grot-cart
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-cart }
    depends_on:
      alloy: { condition: service_healthy }
  orders:
    environment:
      <<: *telemetry
      JAVA_TOOL_OPTIONS: -javaagent:/app/pyroscope.jar
      PYROSCOPE_APPLICATION_NAME: grot-orders
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-orders }
    depends_on:
      alloy: { condition: service_healthy }
  catalog:
    environment: *telemetry
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-catalog }
    depends_on:
      alloy: { condition: service_healthy }
  checkout:
    environment: *telemetry
    logging:
      <<: *logging
      options: { <<: *log-options, tag: grot-checkout }
    depends_on:
      alloy: { condition: service_healthy }
volumes:
  alloy-data:

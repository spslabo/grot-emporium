apiVersion: v1
kind: ServiceAccount
metadata:
  name: grot-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grot-alloy
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grot-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grot-alloy
subjects:
  - kind: ServiceAccount
    name: grot-alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grot-alloy-config
data:
  config.alloy: |
{{ .Files.Get "files/config.alloy" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grot-alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: grot-alloy }
  template:
    metadata:
      labels: { app: grot-alloy }
      annotations:
        grot.destination: {{ .Values.destinationId | quote }}
        checksum/config: {{ .Files.Get "files/config.alloy" | sha256sum }}
    spec:
      serviceAccountName: grot-alloy
      securityContext:
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        runAsNonRoot: true
      containers:
        - name: alloy
          image: {{ .Values.collectorImage | quote }}
          args: [run, --disable-reporting, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
          envFrom:
            - secretRef:
                name: {{ required "collectorSecret is required" .Values.collectorSecret }}
          env:
            - name: GROT_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          ports:
            - { name: health, containerPort: 12345 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: profiles, containerPort: 4040 }
          readinessProbe:
            httpGet: { path: /-/ready, port: health }
          livenessProbe:
            httpGet: { path: /-/healthy, port: health }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy }
      volumes:
        - name: config
          configMap: { name: grot-alloy-config }
        # Fresh buffers on restart prevent retargeting an old destination's WAL.
        - name: data
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
spec:
  selector: { app: grot-alloy }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: profiles, port: 4040, targetPort: profiles }
    - { name: health, port: 12345, targetPort: health }

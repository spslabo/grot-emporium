server:
  port: ${port:8080}
  forward-headers-strategy: NATIVE

spring:
  # Model beans are explicitly configured by config/chat; do not auto-create
  # an AWS client when the shopping assistant is disabled.
  ai:
    model:
      chat: none
  messages:
    basename: lang/messages
  http:
    codecs:
      max-in-memory-size: 10MB

retail:
  ui:
    theme: default
    disable-demo-warnings: false
    product-images-path:
    endpoints:
      catalog:
      carts:
      checkout:
      orders:
      recommendations:
    search:
      enabled: false
    chat:
      enabled: false
      temperature: 0.6
      max-tokens: 300
      provider:
      model:
      prompt: |
        You are the helpful shopping assistant for Grot Emporium, a demonstration
        store selling orange Grafana Grot silicone squishies, not foam toys or cards.
        Our collection is Original, On-Call, Cloud, Firefighter, Space, Zen, Disco,
        Golden, and Super Rare Sparkly Grot. Grot always keeps its original orange
        color; only accessories vary. Be warm, concise, and playful.
        This is a demo: no real purchases, payments, deliveries, or stock promises.
        Do not invent prices, stock levels, product safety claims, or order details.
        If information is not available, say so. Never ask for passwords, payment
        card details, private credentials, or other sensitive information.
      bedrock:
        region:
      openai:
        base-url: http://localhost:8000
        api-key:

grot:
  agent-observability:
    enabled: ${GROT_AGENT_OBSERVABILITY_ENABLED:false}
  faro:
    enabled: ${FARO_ENABLED:false}
    url: ${FARO_COLLECTOR_URL:}
    public-url-acknowledged: ${FARO_PUBLIC_URL_ACKNOWLEDGED:false}
    environment: ${DEPLOYMENT_ENVIRONMENT:demo}
    version: ${SERVICE_VERSION:local}

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus

# Enable explicitly in deployment; keep unconfigured development offline.
# Bounded histogram buckets for Prometheus latency/SLO queries.
management.metrics.distribution.slo.http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s

otel.sdk.disabled: ${OTEL_SDK_DISABLED:true}
logging:
  structured:
    format:
      console: logstash

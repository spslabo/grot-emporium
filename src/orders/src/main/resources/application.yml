management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus

spring.autoconfigure.exclude:
  - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

server:
  port: ${port:8080}

spring.flyway.baseline-on-migrate: true

retail:
  orders:
    persistence:
      provider: "in-memory"
      postgres:
        endpoint:
        dbname:
        username:
        password:
    messaging:
      provider: "in-memory"
      rabbitmq:
        addresses: ""
        username: ""
        password: ""
      sqs:
        topic: ""

springdoc:
  api-docs:
    version: OPENAPI_3_0

# Bounded histogram buckets for Prometheus latency/SLO queries.
management.metrics.distribution.slo.http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s

otel.sdk.disabled: ${OTEL_SDK_DISABLED:true}
logging:
  structured:
    format:
      console: logstash

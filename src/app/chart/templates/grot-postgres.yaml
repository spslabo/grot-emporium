{{- if .Values.grotDatabase.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grot-postgres-config
data:
  postgresql.conf: |
{{ .Files.Get "files/postgresql.conf" | indent 4 }}
  init.sql: |
{{ .Files.Get "files/postgres-init.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: grot-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grot-postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grot-postgres }
  template:
    metadata:
      labels:
        app: grot-postgres
        app.kubernetes.io/part-of: grot-emporium
        service_name: grot-postgres
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/postgresql.conf") (.Files.Get "files/postgres-init.sql") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true }
      containers:
        - name: postgres
          image: {{ .Values.grotDatabase.image | quote }}
          args: [postgres, -c, config_file=/etc/grot-postgres/postgresql.conf]
          envFrom:
            - secretRef: { name: grot-database-runtime }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: orders }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          startupProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, orders] }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, orders] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/grot-postgres, readOnly: true }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: config
          configMap:
            name: grot-postgres-config
            items: [{ key: postgresql.conf, path: postgresql.conf }]
        - name: init
          configMap:
            name: grot-postgres-config
            items: [{ key: init.sql, path: 10-grot.sql }]
        # Disposable demo data: pod replacement resets orders. Not production storage.
        - name: data
          emptyDir: { sizeLimit: 1Gi }
        - name: run
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grot-postgres
spec:
  podSelector:
    matchLabels: { app: grot-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { service_name: grot-orders }
        - podSelector:
            matchLabels: { app: grot-alloy }
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}

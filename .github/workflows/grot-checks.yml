name: Grot code checks
on:
  pull_request:
  push:
    branches: [main, feat/grot-emporium-observability]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: azure/setup-helm@v4.3.1
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/sync_grot_alloy.py --check
      - run: |
          for script in tests/k6/shopping.js tests/k6/browser.js tests/k6/traffic.js; do
            docker run --rm -v "$PWD:/work:ro" -w /work grafana/k6:2.3.0 inspect \
              -e BASE_URL=http://localhost:8080 -e TARGET_AUTHORIZED=true "$script"
          done
      - run: git diff --check
  java-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: npm ci && npm test && npm run build
        working-directory: src/ui/frontend
      - run: mvn -B test
        working-directory: src/ui
  java-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cart, orders]
    env:
      AWS_ACCESS_KEY_ID: localtest
      AWS_SECRET_ACCESS_KEY: localtest
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B test
        working-directory: src/${{ matrix.service }}
  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/local/check.sh
      - run: bash tests/local/check-portable.sh
      - run: bash tests/telemetry/check-destinations.sh
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/catalog/go.mod
          cache-dependency-path: src/catalog/go.sum
      - run: go test -race . ./middleware -count=1
        working-directory: src/catalog
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node ../../.yarn/releases/yarn-4.11.0.cjs install --immutable
        working-directory: src/checkout
      - run: node ../../.yarn/releases/yarn-4.11.0.cjs build
        working-directory: src/checkout
      - run: node ../../.yarn/releases/yarn-4.11.0.cjs jest --runInBand span-profiling.spec.ts
        working-directory: src/checkout

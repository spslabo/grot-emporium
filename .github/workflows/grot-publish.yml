name: Publish Grot images
on:
  workflow_dispatch:
  push:
    tags: ['grot-v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/telemetry/check-destinations.sh
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ui, cart, orders, catalog, checkout]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select repository-relative image prefix
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
  deployment-settings:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Print Kubernetes deployment settings
        shell: bash
        run: |
          image_prefix="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf '## Kubernetes deployment settings\n\n'
            printf 'All five app images have been published. Copy these commands into your deployment terminal:\n\n'
            printf '```sh\n'
            printf 'export IMAGE_PREFIX="%s"\n' "$image_prefix"
            printf 'export VERSION="%s"\n' "$GITHUB_SHA"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
